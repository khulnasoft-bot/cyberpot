# Logrotate configuration for CyberPot logs

/data/*/log/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0644 cyberpot cyberpot
    maxsize 100M
    sharedscripts
    postrotate
        # Signal containers to reopen log files if needed
        docker kill --signal=HUP $(docker ps -q) 2>/dev/null || true
    endscript
}

/data/*/log/*.json {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0644 cyberpot cyberpot
    maxsize 100M
}

# Elasticsearch logs
/data/elasticsearch/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    maxsize 50M
}

# Logstash logs
/data/logstash/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    maxsize 50M
}
