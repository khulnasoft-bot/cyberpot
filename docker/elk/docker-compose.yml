services:

  # ELK services
  ## Elasticsearch service
  elasticsearch:
    build: elasticsearch/.
    container_name: elasticsearch
    restart: always
    environment:
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms2048m -Xmx2048m
      - ES_TMPDIR=/tmp
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 4g
    ports:
      - "127.0.0.1:64298:9200"
    image: "ghcr.io/khulnasoft/elasticsearch:24.04.1"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    volumes:
      - $HOME/cyberpot/data:/data

  ## Kibana service
  kibana:
    build: kibana/.
    container_name: kibana
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 1g
    ports:
      - "127.0.0.1:64296:5601"
    image: "ghcr.io/khulnasoft/kibana:24.04.1"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m

  ## Logstash service
  logstash:
    build: logstash/.
    container_name: logstash
    restart: always
    #    environment:
    #     - LS_JAVA_OPTS=-Xms2048m -Xmx2048m
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: "ghcr.io/khulnasoft/logstash:24.04.1"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    volumes:
      - $HOME/cyberpot/data:/data
  #     - /root/cyberpot/docker/elk/logstash/dist/logstash.conf:/etc/logstash/conf.d/logstash.conf

  # Map Redis Service
  map_redis:
    container_name: map_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    image: "ghcr.io/khulnasoft/redis:24.04.1"
    security_opt:
      - no-new-privileges:true
    read_only: true

  # Map Web Service
  map_web:
    build: map/.
    container_name: map_web
    restart: always
    environment:
      - MAP_COMMAND=AttackMapServer.py
    ports:
      - "127.0.0.1:64299:64299"
    image: "ghcr.io/khulnasoft/map:24.04.1"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    depends_on:
      - map_redis

  # Map Data Service
  map_data:
    container_name: map_data
    restart: always
    environment:
      - MAP_COMMAND=DataServer_v2.py
    image: "ghcr.io/khulnasoft/map:24.04.1"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    depends_on:
      - map_redis
