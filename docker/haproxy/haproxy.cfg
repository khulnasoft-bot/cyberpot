global
    log stdout format raw local0
    maxconn 4096
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

# Stats page
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE

# Backend API
frontend api
    bind *:3000
    default_backend cyberpot_backend
    
    # Health check endpoint
    acl is_health path /health
    use_backend cyberpot_backend if is_health

backend cyberpot_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    # Backend servers (dynamically scaled)
    server-template backend 10 backend:3000 check inter 2000 rise 2 fall 3
    
    # Sticky sessions using cookies
    cookie SERVERID insert indirect nocache
    
    # Connection limits
    default-server maxconn 100
