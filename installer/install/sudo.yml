---
#######################################
# CyberPot - Debian Bootstrapping (sudo) #
#######################################

# Be sure to use root password as become password
- name: CyberPot - Debian Bootstrapping (sudo)
  hosts: all
  gather_facts: true
  become: false

  tasks:
    - name: Check if running as root
      assert:
        that: ansible_user_id != 'root'
        fail_msg: "CyberPot playbook should not be run as root."
        success_msg: "Running as user: {{ ansible_user_id }}."
      tags:
        - "Debian"

    - name: Check if running as cyberpot
      assert:
        that: ansible_user_id != 'cyberpot'
        fail_msg: "Reserved username `cyberpot` detected."
        success_msg: "Running as user: {{ ansible_user_id }}."
      tags:
        - "Debian"

    - name: Validate distribution is Debian-based
      assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: "This playbook is for Debian-based systems only. Detected: {{ ansible_facts['os_family'] }}"
        success_msg: "Validated OS: {{ ansible_facts['distribution'] }}"
      tags:
        - "Debian"

    - name: Check if sudo is installed
      ansible.builtin.package_facts:
        manager: auto
      tags:
        - "Debian"

    - name: Install sudo and configure user access (Debian)
      become: true
      become_method: su
      block:
        - name: Install sudo package
          ansible.builtin.apt:
            name: sudo
            state: present
            update_cache: yes
          when: "'sudo' not in ansible_facts.packages"

        - name: Add user to sudo group
          ansible.builtin.user:
            name: "{{ ansible_user_id }}"
            groups: sudo
            append: yes

        # SECURITY NOTE: This grants full sudo access without password.
        # This is required for automated Ansible playbooks but reduces security.
        # In production, consider:
        # - Using NOPASSWD only for specific commands
        # - Implementing time-limited sudo sessions
        # - Using Ansible Vault for sensitive operations
        - name: Configure sudoers for passwordless sudo
          ansible.builtin.lineinfile:
            path: /etc/sudoers.d/{{ ansible_user_id }}
            line: '{{ ansible_user_id }} ALL=(ALL:ALL) NOPASSWD:ALL'
            create: yes
            mode: '0440'
            validate: 'visudo -cf %s'
      when: "'sudo' not in ansible_facts.packages or ansible_user_id not in getent_group.sudo.2.split(',')"
      tags:
        - "Debian"

    - name: Verify sudo configuration
      become: true
      ansible.builtin.command:
        cmd: sudo -l -U {{ ansible_user_id }}
      register: sudo_check
      changed_when: false
      tags:
        - "Debian"

    - name: Display sudo configuration
      ansible.builtin.debug:
        msg: "Sudo configured successfully for user {{ ansible_user_id }}"
      when: sudo_check.rc == 0
      tags:
        - "Debian"

