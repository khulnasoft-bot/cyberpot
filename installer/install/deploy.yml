---
###########################
# CyberPot Sensor Deployment #
###########################

- name: CyberPot Sensor Deployment
  hosts: all
  vars:
    local_nginx_cert_path: "~/cyberpot/data/nginx/cert/nginx.crt"
    remote_cert_path: "~/cyberpot/data/hive.crt"
    remote_sensor_yml_path: "~/cyberpot/compose/sensor.yml"
    remote_docker_compose_path: "~/cyberpot/docker-compose.yml"
    env_file_path: "~/cyberpot/.env"
    hive_user: "{{ lookup('env', 'myCYBERPOT_HIVE_USER') }}"
    hive_ip: "{{ lookup('env', 'myCYBERPOT_HIVE_IP') }}"

  tasks:
    - name: Validate required environment variables
      assert:
        that:
          - hive_user | length > 0
          - hive_ip | length > 0
        fail_msg: |
          Required environment variables not set!
          Please export:
            export myCYBERPOT_HIVE_USER="your-hive-username"
            export myCYBERPOT_HIVE_IP="your-hive-ip-address"
        success_msg: "Environment variables validated: HIVE_USER={{ hive_user }}, HIVE_IP={{ hive_ip }}"

    - name: Ensure the destination directory exists
      ansible.builtin.file:
        path: "{{ remote_cert_path | dirname }}"
        state: directory
        mode: '0770'

    - name: Copy nginx.crt from local to remote host
      ansible.builtin.copy:
        src: "{{ local_nginx_cert_path }}"
        dest: "{{ remote_cert_path }}"
        mode: '0644'

    - name: Copy sensor.yml to docker-compose.yml on the remote host
      ansible.builtin.copy:
        src: "{{ remote_sensor_yml_path }}"
        dest: "{{ remote_docker_compose_path }}"
        remote_src: yes
        backup: yes
        mode: '0644'

    - name: Backup .env file before modification
      ansible.builtin.copy:
        src: "{{ env_file_path }}"
        dest: "{{ env_file_path }}.backup.{{ ansible_date_time.epoch }}"
        remote_src: yes
        mode: '0600'
      ignore_errors: yes  # File might not exist on first run

    - name: Update CYBERPOT_HIVE_USER in .env
      ansible.builtin.lineinfile:
        path: "{{ env_file_path }}"
        regexp: '^CYBERPOT_HIVE_USER='
        line: 'CYBERPOT_HIVE_USER={{ hive_user }}'
        create: yes
        mode: '0600'

    - name: Update CYBERPOT_HIVE_IP in .env
      ansible.builtin.lineinfile:
        path: "{{ env_file_path }}"
        regexp: '^CYBERPOT_HIVE_IP='
        line: 'CYBERPOT_HIVE_IP={{ hive_ip }}'
        create: yes
        mode: '0600'

    - name: Ensure CYBERPOT_TYPE is set to SENSOR in .env
      ansible.builtin.lineinfile:
        path: "{{ env_file_path }}"
        regexp: '^CYBERPOT_TYPE='
        line: 'CYBERPOT_TYPE=SENSOR'
        create: yes
        mode: '0600'

    - name: Ensure WEB_USER is empty in .env
      ansible.builtin.lineinfile:
        path: "{{ env_file_path }}"
        regexp: '^WEB_USER='
        line: 'WEB_USER='
        create: yes
        mode: '0600'

    - name: Ensure LS_WEB_USER is empty in .env
      ansible.builtin.lineinfile:
        path: "{{ env_file_path }}"
        regexp: '^LS_WEB_USER='
        line: 'LS_WEB_USER='
        create: yes
        mode: '0600'

    - name: Display pre-reboot summary
      ansible.builtin.debug:
        msg: |
          Sensor deployment configuration complete:
          - HIVE_USER: {{ hive_user }}
          - HIVE_IP: {{ hive_ip }}
          - TYPE: SENSOR
          - Backup created: {{ env_file_path }}.backup.{{ ansible_date_time.epoch }}
          System will reboot in 10 seconds...

    - name: Wait before reboot
      ansible.builtin.pause:
        seconds: 10
        prompt: "Rebooting sensor in 10 seconds. Press Ctrl+C to abort."
      when: ansible_check_mode == false

    - name: Reboot the sensor
      become: yes
      ansible.builtin.reboot:
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        msg: "Reboot initiated by Ansible for CyberPot sensor deployment."
        test_command: "uptime"
      when: ansible_check_mode == false

